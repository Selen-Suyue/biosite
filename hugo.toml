baseURL = 'https://selen-suyue.github.io/biosite/'
locale = 'zh-CN'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
summaryLength = 100
title = "Selen's Blogs"

theme = 'reimu'
disableKinds = ['rss']


[outputs]
home = ["HTML", "SearchIndex"]

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "search-index"
isPlainText = true
notAlternative = true

[pagination]
pagerSize = 6

# Reuse original illustrations as build-time image resources. Hugo publishes
# resized WebP variants while the original content URLs remain available.
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'content/imgs'
target = 'assets/imgs'
[[module.mounts]]
source = 'static/images'
target = 'assets/images'
[[module.mounts]]
source = 'static/avatar'
target = 'assets/avatar'
[[module.mounts]]
source = 'static/css'
target = 'assets/site-css'
[[module.mounts]]
source = 'static/js'
target = 'assets/site-js'

# Keep article navigation consistent with the newest-first home page.
[page]
nextPrevInSectionSortOrder = "desc"

# enable search algolia

# enable code highlight
[markup.highlight]
guessSyntax = true
noClasses = false

# enable math katex
[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]
