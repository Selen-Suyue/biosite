{{- $pag := .Paginator -}}
{{- if gt $pag.TotalPages 1 -}}
  <nav id="page-nav" class="blog-pagination" aria-label="文章列表分页">
    {{- with $pag.Prev -}}
      <a class="extend prev" rel="prev" href="{{ .URL | relURL }}" aria-label="上一页">← 上一页</a>
    {{- else -}}
      <span class="pagination-spacer"></span>
    {{- end -}}
    <span class="pagination-status">第 {{ $pag.PageNumber }} / {{ $pag.TotalPages }} 页</span>
    {{- with $pag.Next -}}
      <a class="extend next" rel="next" href="{{ .URL | relURL }}" aria-label="下一页">下一页 →</a>
    {{- else -}}
      <span class="pagination-spacer"></span>
    {{- end -}}
  </nav>
{{- end -}}
